<h1>⚠️ ここに飛ばされた = 「乗っ取り成功（飛ばされた）」</h1>
<p>このページが見えている＝タップ乗っ取りが発火した。実サイトではここが広告/詐欺ページ、
または Content Blocker でドメインブロックされて「黒画面」になる。</p>
<p>このページに来なければ「飛ばさせない化 成功」。</p>
