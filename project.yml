name: AdblockKeshi
options:
  bundleIdPrefix: com.kureho
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
settings:
  base:
    DEVELOPMENT_TEAM: L455WPL8QZ
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only (iPad multitasking 対応不要にする)

targets:
  AdblockKeshi:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 広告消し
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.kureho.adblockkeshi.filter-refresh
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kureho.adblockkeshi
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    dependencies:
      - target: ContentBlockerExtension
        embed: true

  ContentBlockerExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
      - path: Shared
    info:
      path: Extension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
          NSExtensionAttributes:
            ContentBlockerExtensionType: "general"
        CFBundleDisplayName: 広告消し
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kureho.adblockkeshi.blocker
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        PRODUCT_NAME: ContentBlockerExtension

  AdblockKeshiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AdblockKeshi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AdblockKeshi.app/AdblockKeshi

schemes:
  AdblockKeshi:
    build:
      targets:
        AdblockKeshi: all
        AdblockKeshiTests: [test]
    test:
      targets:
        - AdblockKeshiTests
