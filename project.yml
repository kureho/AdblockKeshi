name: AdblockKeshi
options:
  bundleIdPrefix: com.kureho
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
settings:
  base:
    DEVELOPMENT_TEAM: L455WPL8QZ
    MARKETING_VERSION: "3.4.0"
    CURRENT_PROJECT_VERSION: "24"
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only (iPad multitasking 対応不要にする)

targets:
  AdblockKeshi:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # 報告反映(popunder)の combined を App の coordinator が生成するため、8KB の base を App にも同梱。
      # （標準 variant 22MB と違い小さい。App Group コピー頼みは fresh install で nil になり PR#30 と同じ
      #  「app が rule base を読めない」regression を再発させるため、bundle 同梱が必須。）
      - path: PopunderBlockerExtension/Resources/popunder-rules.json
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 広告消し
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPhone only (Info.plist で明示)。~ipad の orientation 宣言は外す → iPad 対応扱いを避ける
        UIDeviceFamily:
          - 1
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.kureho.adblockkeshi.filter-refresh
        ITSAppUsesNonExemptEncryption: false
        # Per-install salt for uuid_hash. The salt only needs to be consistent
        # per device — it's not a server-shared secret. Workers stores
        # `uuid_hash` as an opaque string and never reverses it.
        DEV_SERVER_SALT: adblockkeshi-v3-prod-salt-2026-06
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kureho.adblockkeshi
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only (target level でも厳密化)
    dependencies:
      - target: ContentBlockerExtension
        embed: true
      - target: PopunderBlockerExtension
        embed: true
      - target: PopupShieldExtension
        embed: true

  ContentBlockerExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
      - path: Shared
    info:
      path: Extension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
          NSExtensionAttributes:
            ContentBlockerExtensionType: "general"
        CFBundleDisplayName: 標準フィルタ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kureho.adblockkeshi.blocker
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        PRODUCT_NAME: ContentBlockerExtension

  # 2026-06-23 4→3 統合: ReportedRulesExtension(自己学習フィルタ・reportedblocker)を削除。
  # 自己学習は標準 ContentBlocker の combined-<state> に統合（CombinedRuleListBuilder）。

  PopunderBlockerExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PopunderBlockerExtension
      - path: Shared
    info:
      path: PopunderBlockerExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PopunderContentBlockerRequestHandler
          NSExtensionAttributes:
            ContentBlockerExtensionType: "general"
        CFBundleDisplayName: ポップアップ広告対策
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kureho.adblockkeshi.popunderblocker
        CODE_SIGN_ENTITLEMENTS: PopunderBlockerExtension/Extension.entitlements
        PRODUCT_NAME: PopunderBlockerExtension

  PopupShieldExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PopupShieldExtension/SafariWebExtensionHandler.swift
      # Web Extension リソース: ルート直下ファイルは個別指定で resources phase へ（bundle ルートに平坦化）。
      # _locales は階層（_locales/ja/messages.json）を保つためフォルダ参照にする。
      - path: PopupShieldExtension/Resources/manifest.json
      - path: PopupShieldExtension/Resources/background.js
      - path: PopupShieldExtension/Resources/popup.html
      - path: PopupShieldExtension/Resources/popup.js
      - path: PopupShieldExtension/Resources/popup-shield-core.js
      - path: PopupShieldExtension/Resources/popup-shield-main.js
      - path: PopupShieldExtension/Resources/popup-shield-bridge.js
      - path: PopupShieldExtension/Resources/popup-shield-status.js
      - path: PopupShieldExtension/Resources/_locales
        type: folder
      - path: PopupShieldExtension/Resources/images
        type: folder
    info:
      path: PopupShieldExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
        CFBundleDisplayName: 強力ポップアップ対策
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kureho.adblockkeshi.popupshield
        CODE_SIGN_ENTITLEMENTS: PopupShieldExtension/Extension.entitlements
        PRODUCT_NAME: PopupShieldExtension

  AdblockKeshiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AdblockKeshi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AdblockKeshi.app/AdblockKeshi

  AdblockKeshiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AdblockKeshi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AdblockKeshi

schemes:
  AdblockKeshi:
    build:
      targets:
        AdblockKeshi: all
        AdblockKeshiTests: [test]
        AdblockKeshiUITests: [test]
    test:
      targets:
        - AdblockKeshiTests
        - AdblockKeshiUITests
