name: AdblockKeshi
options:
  bundleIdPrefix: com.kureho
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
settings:
  base:
    DEVELOPMENT_TEAM: L455WPL8QZ
    MARKETING_VERSION: "3.2.0"
    CURRENT_PROJECT_VERSION: "22"
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only (iPad multitasking 対応不要にする)

targets:
  AdblockKeshi:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 広告消し
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPhone only (Info.plist で明示)。~ipad の orientation 宣言は外す → iPad 対応扱いを避ける
        UIDeviceFamily:
          - 1
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.kureho.adblockkeshi.filter-refresh
        ITSAppUsesNonExemptEncryption: false
        # Per-install salt for uuid_hash. The salt only needs to be consistent
        # per device — it's not a server-shared secret. Workers stores
        # `uuid_hash` as an opaque string and never reverses it.
        DEV_SERVER_SALT: adblockkeshi-v3-prod-salt-2026-06
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kureho.adblockkeshi
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only (target level でも厳密化)
    dependencies:
      - target: ContentBlockerExtension
        embed: true
      - target: ReportedRulesExtension
        embed: true
      - target: PopunderBlockerExtension
        embed: true

  ContentBlockerExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
      - path: Shared
    info:
      path: Extension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
          NSExtensionAttributes:
            ContentBlockerExtensionType: "general"
        CFBundleDisplayName: 標準フィルタ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kureho.adblockkeshi.blocker
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        PRODUCT_NAME: ContentBlockerExtension

  ReportedRulesExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ReportedRulesExtension
      # Shared/ は Phase 5 で App Group fallback chain (BlockerListResolver / StateStore) を
      # ReportedContentBlockerRequestHandler が利用するため事前同梱。Phase 1 では未使用だが、
      # Phase 5 着手時に sources 変更 + 再 sign を避けるため。
      - path: Shared
    info:
      path: ReportedRulesExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ReportedContentBlockerRequestHandler
          NSExtensionAttributes:
            ContentBlockerExtensionType: "general"
        CFBundleDisplayName: 自己学習フィルタ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kureho.adblockkeshi.reportedblocker
        CODE_SIGN_ENTITLEMENTS: ReportedRulesExtension/Extension.entitlements
        PRODUCT_NAME: ReportedRulesExtension

  PopunderBlockerExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PopunderBlockerExtension
      - path: Shared
    info:
      path: PopunderBlockerExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PopunderContentBlockerRequestHandler
          NSExtensionAttributes:
            ContentBlockerExtensionType: "general"
        CFBundleDisplayName: ポップアップ広告対策
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kureho.adblockkeshi.popunderblocker
        CODE_SIGN_ENTITLEMENTS: PopunderBlockerExtension/Extension.entitlements
        PRODUCT_NAME: PopunderBlockerExtension

  AdblockKeshiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AdblockKeshi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AdblockKeshi.app/AdblockKeshi

  AdblockKeshiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AdblockKeshi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AdblockKeshi

schemes:
  AdblockKeshi:
    build:
      targets:
        AdblockKeshi: all
        AdblockKeshiTests: [test]
        AdblockKeshiUITests: [test]
    test:
      targets:
        - AdblockKeshiTests
        - AdblockKeshiUITests
