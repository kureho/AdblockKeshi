filters:
  # 検証経緯:
  # - 旧 5本構成 (easylist 先頭, annoyances 末尾): yahoo.co.jp 70 / popin 11 (グローバル強・JP弱)
  # - 試行: adguard-japanese 先頭にしたら yahoo.co.jp 70→0 で改悪
  # - 結論: Annoyances (4MB cosmetic ルール) が大量に枠を奪ってる
  #   → Annoyances を外して 4本構成で 150k 上限内に main rule をフィット
  # - 1.0.1 (2026-06-02 復元): トラッカー優先で easyprivacy + adguard-japanese を先頭に。
  #   EasyList は最後 → 150k cap で削れていた google-analytics.com 等 JP 主要トラッカーを
  #   `if-domain` 直接マッチに昇格（覆い率 87% → 90%）
  # - 2026-10-05: easyprivacy を最後へ（日本語 → AdGuard 基本 → EasyList → EasyPrivacy）。
  #   基本保護を 1 本 19.5MB に収めたら（拡張が実機でメモリ上限により落ちるため・build_split_rules.py
  #   LIST_MAX_BYTES）、遮断はこの並び順で詰めるので、先頭の EasyPrivacy が枠を取り EasyList の
  #   `||pagead2.googlesyndication.com^` 等が 2 本目に押し出された（adsbygoogle.js が通る）。
  #   並びを変えても 2 本を合わせた中身は同じ（変換器は種類ごとにまとめる・全量 216,609 件で一致）。
  #   31 サイト × 2 回計測の漏れ（基本保護だけ）: 並び変更前 78.5 / 変更後 35.5（9/27 以前の基本保護 52.0）・
  #   新たな崩れの疑いなし。記録 tasks/ads-not-blocked-2026-10-05.md
