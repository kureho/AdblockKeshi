<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遷移保護</title>
<style>
  :root { color-scheme: light; }
  body { font: -apple-system-body, sans-serif; margin: 0; padding: 16px; width: 300px; background: #fff; color: #111; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.sub { font-size: 12px; color: #666; margin: 0 0 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid #eee; }
  .row .label { font-size: 14px; }
  .row .hint { font-size: 11px; color: #888; margin-top: 2px; }
  .status { display: flex; align-items: center; gap: 8px; padding: 10px 0; font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #bbb; flex: 0 0 auto; }
  .dot.active { background: #34c759; } .dot.warn { background: #ff9500; } .dot.err { background: #ff3b30; } .dot.off { background: #bbb; }
  button.retry { margin-top: 8px; padding: 8px 12px; font-size: 13px; border: 1px solid #ccc; border-radius: 8px; background: #f7f7f7; }
  .counts { font-size: 12px; color: #444; margin-top: 12px; }
  .counts b { color: #111; }
  details { margin-top: 12px; font-size: 11px; color: #555; }
  details summary { cursor: pointer; color: #06c; }
  details .diag { margin-top: 8px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11px; color: #444; }
  .sw { position: relative; width: 46px; height: 28px; flex: 0 0 auto; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw .track { position: absolute; inset: 0; background: #ccc; border-radius: 999px; transition: .2s; }
  .sw .track::before { content: ""; position: absolute; height: 22px; width: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .sw input:checked + .track { background: #34c759; }
  .sw input:checked + .track::before { transform: translateX(18px); }
  .disabled { opacity: .4; pointer-events: none; }
</style>
</head>
<body>
<h1>遷移保護</h1>
<p class="sub">対象サイトで、タップ時に広告サイトへ飛ばす「タブ乗っ取り」を抑えます。閲覧履歴やページ内容を外部に送ることはありません。</p>

<div class="row">
  <div>
    <div class="label">強力モード</div>
    <div class="hint">オンにすると対象サイトで動作します（既定オフ）</div>
  </div>
  <label class="sw"><input type="checkbox" id="enabled"><span class="track"></span></label>
</div>

<!-- 状態表示: トグル ON だけでは「有効」と出さない（実稼働状態を区別） -->
<div class="status"><span class="dot off" id="statusDot"></span><span id="statusLabel">強力モード: オフ</span></div>
<button class="retry" id="retry" style="display:none">登録をやり直す</button>

<div class="row" id="siteRow">
  <div>
    <div class="label">このサイトで一時停止</div>
    <div class="hint" id="siteHost">—</div>
  </div>
  <label class="sw"><input type="checkbox" id="paused"><span class="track"></span></label>
</div>

<div class="counts">ブロック件数: <b id="countNum">0</b></div>

<details id="diagWrap">
  <summary>詳細（診断）</summary>
  <div class="diag" id="diag"></div>
</details>

<script src="popup-shield-core.js"></script>
<script src="popup-shield-status.js"></script>
<script src="popup.js"></script>
</body>
</html>
