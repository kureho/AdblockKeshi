# NOTE: triggers limited to schedule + workflow_dispatch.
# Do NOT add issue / PR / repository_dispatch triggers without sanitizing untrusted fields.
# See: https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
name: Weekly Security Rules Update

on:
  schedule:
    - cron: '13 0 * * 0'  # 毎週日曜 0:13 UTC（0 分は GitHub が混み遅れるのでずらした。2026-10-12）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-security-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # URLhaus は使わない（2026-11-09 kureho 承認）。配布先が 410 になり、取得で毎週止まっていた
      # （10/25・11/1・11/8）。今は登録と鍵が要り、利用条件で営利の利用は有料になり得る。
      # 詳しくは tasks/a218-g0-measurement-2026-11-09.md
      # 詐欺サイトの一覧は HaGeZi Threat Intelligence Feeds（2026-11-09 kureho 承認・前は Phishing.Database）。
      # 許諾は GPL-3.0。作者の条件（hagezi/dns-blocklists Issue #11938）: 全文を付ける・元の見出しを残す・
      # 変換したら改変した旨と日付を書く → NOTICE-security.txt と LICENSE-security.txt を一覧の横に置く。
      # 詳しくは tasks/a218-scam-source-research-2026-11-09.md
      - name: Fetch HaGeZi Threat Intelligence Feeds (public, no auth required)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif-onlydomains.txt" \
            -o /tmp/scam-source.txt
          echo "HaGeZi TIF lines: $(wc -l < /tmp/scam-source.txt)"

      - name: Fetch Tranco top 1M
        run: |
          LATEST_ID=$(curl -fsSL "https://tranco-list.eu/api/lists/date/latest" | python3 -c "import sys, json; print(json.load(sys.stdin)['list_id'])")
          curl -fsSL "https://tranco-list.eu/download/${LATEST_ID}/1000000" \
            -o /tmp/tranco-top-1m.csv
          echo "Tranco lines: $(wc -l < /tmp/tranco-top-1m.csv)"

      - name: Build security-rules.json
        run: |
          python3 scripts/build_security_rules.py \
            --source /tmp/scam-source.txt \
            --tranco /tmp/tranco-top-1m.csv \
            --output /tmp/security-rules.json \
            --notice /tmp/NOTICE-security.txt \
            --limit 30000

      - name: Build empty-rules.json
        run: |
          python3 scripts/build_empty_rules.py --output /tmp/empty-rules.json

      - name: Swap the security part of second-ads-sec.json
        # A-88 ①: 両方オンのセキュリティは 2 本目（second-ads-sec.json）の末尾に載る（月次が
        # 「例外全部＋広告の残り＋セキュリティ（末尾・枠 3 万固定）」で作る）。週次は末尾のセキュリティだけ入れ替える
        # （広告の振り分けは変えない＝基本保護 merged-rules.json は週次では触らない）。
        # 末尾が前回のセキュリティと一致しなければ止める＝CDN は前の版のまま（security-rules.json も含めて。
        # 片方だけ進めると次の週から末尾が合わなくなる）。
        run: |
          python3 scripts/build_split_rules.py swap-security \
            --second docs/cdn/second-ads-sec.json \
            --old-security docs/cdn/security-rules.json \
            --new-security /tmp/security-rules.json \
            --output /tmp/second-ads-sec.json

      - name: Copy outputs to main/docs/cdn (GitHub Pages source)
        run: |
          mkdir -p docs/cdn
          for name in security-rules second-ads-sec empty-rules; do
            cp /tmp/${name}.json docs/cdn/${name}.json
          done
          cp /tmp/NOTICE-security.txt docs/cdn/NOTICE-security.txt
          python3 - <<'PY'
          import json, hashlib, datetime
          from pathlib import Path
          out = {}
          for name in ['security-rules', 'merged-rules', 'empty-rules', 'second-ads-sec']:
              data = Path(f'docs/cdn/{name}.json').read_bytes()
              out[name + '_sha256'] = hashlib.sha256(data).hexdigest()
              out[name + '_bytes'] = len(data)
          out['generated_at'] = datetime.datetime.utcnow().isoformat() + 'Z'
          Path('docs/cdn/version-security.json').write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY

      - name: Commit and push to main/docs/cdn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cdn/security-rules.json docs/cdn/second-ads-sec.json docs/cdn/empty-rules.json docs/cdn/version-security.json \
            docs/cdn/NOTICE-security.txt docs/cdn/LICENSE-security.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(security): weekly auto-update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "Security rules build FAILED. CDN keeps previous version."
