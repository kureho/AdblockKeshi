# NOTE: triggers limited to schedule + workflow_dispatch.
# Do NOT add issue / PR / repository_dispatch triggers without sanitizing untrusted fields.
# See: https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
name: Weekly Security Rules Update

on:
  schedule:
    - cron: '0 0 * * 0'  # 毎週日曜 0:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-security-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch URLhaus host file (public, no auth required)
        run: |
          curl -fsSL "https://urlhaus.abuse.ch/downloads/hostfile/" \
            -o /tmp/urlhaus-hosts.txt
          echo "URLhaus lines: $(wc -l < /tmp/urlhaus-hosts.txt)"

      - name: Fetch Phishing.Database active domains (public, no auth required)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/mitchellkrogza/Phishing.Database/master/phishing-domains-ACTIVE.txt" \
            -o /tmp/phishing-db-active.txt
          echo "Phishing.Database lines: $(wc -l < /tmp/phishing-db-active.txt)"

      - name: Fetch Tranco top 1M
        run: |
          LATEST_ID=$(curl -fsSL "https://tranco-list.eu/api/lists/date/latest" | python3 -c "import sys, json; print(json.load(sys.stdin)['list_id'])")
          curl -fsSL "https://tranco-list.eu/download/${LATEST_ID}/1000000" \
            -o /tmp/tranco-top-1m.csv
          echo "Tranco lines: $(wc -l < /tmp/tranco-top-1m.csv)"

      - name: Build security-rules.json
        run: |
          python3 scripts/build_security_rules.py \
            --urlhaus /tmp/urlhaus-hosts.txt \
            --phishing-db /tmp/phishing-db-active.txt \
            --tranco /tmp/tranco-top-1m.csv \
            --output /tmp/security-rules.json \
            --limit 30000

      - name: Build empty-rules.json
        run: |
          python3 scripts/build_empty_rules.py --output /tmp/empty-rules.json

      - name: Download current ad-rules from CDN
        run: |
          # ad-rules.json は monthly-filter-update.yml が生成する。
          # 同じ CDN に存在する前提（無ければ空配列 fallback）
          curl -fsSL "https://kureho.github.io/AdblockKeshi/cdn/blockerList.json" \
            -o /tmp/ad-rules.json || echo "[]" > /tmp/ad-rules.json
          echo "ad-rules size: $(wc -c < /tmp/ad-rules.json)"

      - name: Build merged-rules.json
        run: |
          python3 scripts/build_merged_rules.py \
            --ad /tmp/ad-rules.json \
            --security /tmp/security-rules.json \
            --output /tmp/merged-rules.json \
            --limit 130000

      - name: Copy outputs to main/docs/cdn (GitHub Pages source)
        run: |
          mkdir -p docs/cdn
          for name in security-rules merged-rules empty-rules; do
            cp /tmp/${name}.json docs/cdn/${name}.json
          done
          python3 - <<'PY'
          import json, hashlib, datetime
          from pathlib import Path
          out = {}
          for name in ['security-rules', 'merged-rules', 'empty-rules']:
              data = Path(f'docs/cdn/{name}.json').read_bytes()
              out[name + '_sha256'] = hashlib.sha256(data).hexdigest()
              out[name + '_bytes'] = len(data)
          out['generated_at'] = datetime.datetime.utcnow().isoformat() + 'Z'
          Path('docs/cdn/version-security.json').write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY

      - name: Commit and push to main/docs/cdn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cdn/security-rules.json docs/cdn/merged-rules.json docs/cdn/empty-rules.json docs/cdn/version-security.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(security): weekly auto-update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "Security rules build FAILED. CDN keeps previous version."
