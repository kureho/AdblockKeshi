# 一時管理ツール: Phase 3（信頼レポーター閾値バイパス）有効化のための
# uuid_hash 取得専用。read-only な SELECT を1回流すだけ。取得後にこのファイルは削除する。
# heavy-process-safety / workflow-timeout-guard 遵守: Linux runner・timeout 必須・手動起動のみ。
name: d1-peek-reports

on:
  workflow_dispatch:

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query recent reports (read-only SELECT)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/d1/database/91b0e61f-d4a2-4dd0-b979-7c6635dbdbe4/query" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"sql":"SELECT uuid_hash, url, domain, created_at FROM reports ORDER BY created_at DESC LIMIT 10"}' \
            | python3 -m json.tool
