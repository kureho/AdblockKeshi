# popunder-rules.json を L1(networks) + L2(aggressive-sites) ソースから再生成し、
# bundle 同梱版 と CDN(docs/cdn) を更新する。
# heavy-process-safety / workflow-timeout-guard 遵守: Linux runner・timeout 必須・最小トリガー。
# 本体フィルタの monthly-filter-update.yml (macOS/SafariConverterLib) とは責務分離（混ぜない）。
name: popunder-rules-update

on:
  workflow_dispatch:
  push:
    # main のみ（feature branch では auto-commit/push できず失敗するため除外）。
    # PR での検証は pr-popup-shield.yml（artifact 再生成一致チェック）が担う。
    branches:
      - main
    paths:
      - 'tasks/b-popunder-script/popunder-script-networks.txt'
      - 'tasks/b-popunder-script/popunder-aggressive-sites.json'
      - 'scripts/build_popunder_rules.py'

# ★生成物を main へコミットするので書き込み権限が要る（2026-09-18 追加）。
#   ❌ 既定の権限に任せる → ✅ 姉妹 workflow（build-security-rules / monthly-filter-update）と同じく明示する
#   → 理由: 2026-06-17〜06-23 の 3 回とも
#     `remote: Permission to kureho/AdblockKeshi.git denied to github-actions[bot]` (403) で落ちていた。
#     生成そのものは成功していて push だけ失敗するので、**失敗に気付かないまま
#     CDN が古いままになる**クラス（今回は手動コミットで追いついていて実害なし）。
permissions:
  contents: write

concurrency:
  group: popunder-rules
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate popunder rules (bundle + cdn)
        run: |
          python3 scripts/build_popunder_rules.py \
            --networks tasks/b-popunder-script/popunder-script-networks.txt \
            --sites tasks/b-popunder-script/popunder-aggressive-sites.json \
            --out PopunderBlockerExtension/Resources/popunder-rules.json \
            --out docs/cdn/popunder-rules.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add PopunderBlockerExtension/Resources/popunder-rules.json docs/cdn/popunder-rules.json
          git diff --cached --quiet || git commit -m "build(popunder): regenerate rules [skip ci]"
          git push
