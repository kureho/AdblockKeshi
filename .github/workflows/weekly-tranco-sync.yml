name: weekly-tranco-sync
on:
  schedule:
    - cron: '0 2 * * 0'  # weekly Sunday 02:00 UTC
  workflow_dispatch:

concurrency:
  group: d1-read-heavy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json
      - run: cd workers && npm ci
      - name: Fetch Tranco Top 1M CSV
        run: |
          # Tranco list URL changes daily; this is a placeholder
          # TODO: scripts/sync/tranco-sync.ts で実装
          echo "TODO: download https://tranco-list.eu/download_daily/X9G9G.csv"
      - name: Update D1 tranco_top_1m table
        run: cd workers && npx wrangler d1 execute adblockkeshi-reports --remote --command "SELECT 'TODO: tranco-sync script' AS placeholder"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
