# Plan B Task 1.3 weekly Tranco Top 1M sync.
# Downloads Tranco daily-list zip, unzips, then refreshes D1 tranco_top_1m.

name: weekly-tranco-sync
on:
  schedule:
    - cron: '0 2 * * 0'  # weekly Sunday 02:00 UTC
  workflow_dispatch:

concurrency:
  group: d1-read-heavy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json
      - run: cd workers && npm ci
      - name: Fetch + unzip Tranco Top 1M CSV
        run: |
          curl -fL --retry 3 'https://tranco-list.eu/top-1m.csv.zip' -o /tmp/tranco.zip
          unzip -p /tmp/tranco.zip > /tmp/tranco.csv
          echo "lines: $(wc -l < /tmp/tranco.csv)"
      - name: Sync to D1 tranco_top_1m
        run: cd workers && npx tsx ../scripts/sync/run-tranco-sync.ts /tmp/tranco.csv
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: 91b0e61f-d4a2-4dd0-b979-7c6635dbdbe4
