# NOTE: triggers are limited to schedule + workflow_dispatch.
# If you ever add issue / PR / comment / repository_dispatch triggers,
# DO NOT interpolate untrusted fields (github.event.issue.title etc.)
# into `run:` directly. Use env: vars with $VAR + quoting.
# See: https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

name: Monthly Filter Update

on:
  schedule:
    - cron: '0 3 1 * *'  # 毎月1日 03:00 UTC (JST 12:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-filters:
    runs-on: macos-latest  # SafariConverterLib (Swift) が macOS 必須
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Clone and build SafariConverterLib (15 万件の打ち切りを外す)
        # A-88 ①: 全量を上限なしで変換し、scripts/build_split_rules.py で基本保護と 2 本目に振り分ける。
        # 版は振り分けを計測した版に固定する（上げるときは計測をやり直す）。
        # 上限の書き方が変わって置き換えが効かなければ、ここで止める（打ち切られた全量で振り分けない）。
        env:
          CONVERTER_REF: 2462a48f286dcf39d1cc0a9f198126600f599bff
        run: |
          mkdir -p scripts/converter-build/SafariConverterLib
          cd scripts/converter-build/SafariConverterLib
          git init -q
          git fetch -q --depth 1 https://github.com/AdguardTeam/SafariConverterLib.git "$CONVERTER_REF"
          git checkout -q FETCH_HEAD
          LIMIT_FILE=Sources/ContentBlockerConverter/Rules/SafariVersion.swift
          sed -i '' 's/? 150000 : 50000/? 100_000_000 : 50000/' "$LIMIT_FILE"
          grep -q '? 100_000_000 : 50000' "$LIMIT_FILE" || { echo "rule limit patch did not apply" >&2; exit 1; }
          swift build -c release

      - name: Install Python dependencies
        # macos-latest runner の Homebrew Python は PEP 668 (externally-managed) で
        # 素の pip install を拒否する。使い捨て CI 環境なので override してよい
        run: python3 -m pip install --user --break-system-packages pyyaml

      - name: Run conversion
        run: bash scripts/convert.sh

      - name: Detect diff
        id: diff
        run: |
          # 新しく増えたファイル（second-*.json）も拾うため git diff ではなく git status で見る
          if [ -z "$(git status --porcelain docs/cdn/ App/Resources/version.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No filter changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected, will commit and push."
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cdn/ App/Resources/version.json
          git commit -m "chore(filter): monthly auto-update $(date -u +%Y-%m-%d)"
          git push
