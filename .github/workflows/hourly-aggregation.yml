# Plan B Task 3.2: hourly aggregation (L2 threshold集計 + ban level up)
# Memory workflow-timeout-guard hook 遵守: timeout-minutes 必須、Linux runner only.

name: hourly-aggregation
on:
  schedule:
    - cron: '0 * * * *'  # :00 hourly (workflow群のトリガ時刻分散、spec rev4 §5)
  workflow_dispatch:

concurrency:
  group: d1-write
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json
      - run: cd workers && npm ci
      - name: Aggregate reports (L2 threshold)
        run: cd workers && npx wrangler d1 execute adblockkeshi-reports --remote --command "SELECT 'TODO: aggregate-reports script' AS placeholder"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      # TODO Plan B Task 1.2: scripts/aggregation/aggregate-reports.ts 実装後にここを置換
