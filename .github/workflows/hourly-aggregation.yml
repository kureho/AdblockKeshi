# Plan B Task 3.2: hourly aggregation (L2 threshold集計).
# Plan C Chunk 1 Task 1.2: 4-tier auto-ban escalation (spec rev4 §4) を同じ
# step 内で aggregate → ban-engine の順に実行。
# Memory workflow-timeout-guard hook 遵守: timeout-minutes 必須、Linux runner only.

name: hourly-aggregation
on:
  schedule:
    - cron: '0 * * * *'  # :00 hourly
  workflow_dispatch:

concurrency:
  group: d1-write
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json
      - run: cd workers && npm ci
      - name: Aggregate reports (L2 threshold)
        run: cd workers && npx tsx ../scripts/aggregation/run.ts
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: 91b0e61f-d4a2-4dd0-b979-7c6635dbdbe4
          # 信頼レポーター(kureho 自身の uuid_hash 等・カンマ区切り)。未設定なら通常閾値のまま(no-op)。
          # 有効化: Settings→Secrets に TRUSTED_UUID_HASHES を設定するだけ（コード変更不要）。
          TRUSTED_UUID_HASHES: ${{ secrets.TRUSTED_UUID_HASHES }}
      - name: Retention backstop (14d URL redaction floor)
        if: always()  # 層A=correctness floor は層B(aggregation step)の成否から独立して必ず回す（spec §3）
        run: cd workers && npx tsx ../scripts/redaction/run-retention-backstop.ts
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: 91b0e61f-d4a2-4dd0-b979-7c6635dbdbe4
